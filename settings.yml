# Game settings. Edit these values to change how the game looks/behaves.

# Render every 3D object (player, ground, obstacles, gems) as a wireframe.
wireframe: true

# Surface opacity (0 = invisible, 1 = fully solid) used for object surfaces when wireframe is on.
opacity: 0.75

# Line thickness for the wireframe edge outlines.
edgeWidth: 1

# Forward speed (units per second) the player starts a run at.
baseSpeed: 25

# Forward speed (units per second) the run speeds up to and caps at.
maxSpeed: 200

# How fast forward speed ramps up over time (units per second, per second elapsed).
speedRamp: 0.75

# Sound settings.
sound:
  # Master on/off switch for all sound, including music. When false, sound files aren't even
  # loaded, not just muted.
  enabled: false
  # Background music volume (0 = silent, 1 = full volume).
  musicVolume: 0.4
  # Sound effect volume (0 = silent, 1 = full volume).
  sfxVolume: 0.8

# Test mode, for debugging: spawn only one object type and/or skip dimming the game-over overlay
# so the scene stays inspectable after a collision. Leave enabled: false for normal play.
testMode:
  enabled: false
  # What to spawn: "gems", "obstacles", or "both".
  spawn: both
  # Whether the game-over overlay darkens the scene behind it.
  dimGameOver: true
  # Whether the player collides with obstacles. Set false to fly through them and observe
  # things like obstacle density over time without the run ending.
  collideWithObstacles: true
